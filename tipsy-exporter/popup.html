<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoleLeaf</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="picker">
  <header>
    <span class="eyebrow" data-i18n="BOT EXPORTER">BOT EXPORTER</span>
    <h1 data-i18n="Choose characters to export">Choose characters to export</h1>
    <select id="language" aria-label="Language" data-i18n-aria-label="Language"></select>
    <p id="identity" data-i18n="Detecting the source site…">Detecting the source site…</p>
  </header>
  <main>
    <div class="actions export-scope"><button id="chat-mode" type="button" aria-pressed="true" data-i18n="Recent chats">Recent chats</button><button id="creator-mode" type="button" aria-pressed="false" data-i18n="My Characters">My Characters</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="picker" hidden aria-label="Chat list" data-i18n-aria-label="Chat list">
      <input id="search" type="search" aria-label="Search characters" placeholder="Search by name or ID" data-i18n-aria-label="Search characters" data-i18n-placeholder="Search by name or ID">
      <div class="picker-tools">
        <label><input id="select-all" type="checkbox"> <span data-i18n="Select all results">Select all results</span></label>
        <button id="clear" class="link" type="button" data-i18n="Clear selection">Clear selection</button>
      </div>
      <div id="bot-list" class="bot-list" aria-label="Select characters" data-i18n-aria-label="Select characters"></div>
      <p id="empty" class="muted" hidden data-i18n="No matching characters.">No matching characters.</p>
    </section>
    <footer class="picker-footer">
      <span id="selected-count" aria-live="polite" data-i18n="0 selected">0 selected</span>
      <button id="collect" class="primary" type="button" disabled data-i18n="Export characters">Export characters</button>
    </footer>
    <p class="footnote" id="scope-note" data-i18n="Each ZIP includes the character name, current chat, and chat images. The list comes from the chat sidebar on this page.">Each ZIP includes the character name, current chat, and chat images. The list comes from the chat sidebar on this page.</p>
    <div class="actions">
      <button id="open-profile" class="link" type="button" hidden data-i18n="Open my profile">Open my profile</button>
      <button id="refresh-list" class="link" type="button" data-i18n="Refresh list">Refresh list</button>
      <button id="refresh-page" class="link" type="button" data-i18n="Reload source page">Reload source page</button>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="messages.js"></script>
  <script src="core.js"></script>
  <script src="bot-model.js"></script>
  <script src="bot-creator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
