plugins { id 'com.android.application' }

android {
    signingConfigs {
        debug { storeFile rootProject.file('.signing/debug.keystore') }
        demo {
            def keyPath = System.getenv('ROLELEAF_DEMO_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ROLELEAF_DEMO_STORE_PASSWORD')
                keyAlias 'roleleaf-demo'
                keyPassword System.getenv('ROLELEAF_DEMO_STORE_PASSWORD')
            }
        }
    }
    namespace 'io.github.quillharbor.roleleaf.test'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.quillharbor.roleleaf.demo'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '0.5.13-demo.29'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            signingConfig signingConfigs.demo
            debuggable false
        }
    }
    sourceSets.main.assets.srcDirs += ['build/generated/assets']
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

tasks.register('syncExporterAssets', Sync) {
    into layout.buildDirectory.dir('generated/assets')
    from('../../tipsy-exporter') {
        into 'shared'
        include 'i18n.js', 'messages.js', 'core.js', 'chat.js', 'png.js', 'bot-model.js', 'bot-creator.js', 'bot-package.js', 'collect-bot.js'
        include 'page.bundle.js', 'bridge.bundle.js', 'cai-page.bundle.js', 'cai-bridge.bundle.js'
    }
    from('../../assets/brand/roleleaf-avatar-v1/roleleaf-anime-avatar.png') {
        into 'brand'
        rename { 'logo.png' }
    }
}
tasks.named('preBuild').configure { dependsOn 'syncExporterAssets' }
